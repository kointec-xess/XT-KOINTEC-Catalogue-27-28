<style>
/* Layout: one-screen reader — toolbar, the book on a calm "desk", a page scrubber. Pages are print pages (always white paper); the desk follows the viewer's theme. All page-internal sizes use cqw so a page scales as one object. Tokens from the KOINTEC Interior Film design system. */
:root{
  --navy:#082f49; --deep:#0d1728; --teal:#0d5362; --blue:#176eb0; --orange:#ff6b1a; --orange-700:#c2410c;
  --paper:#ffffff; --soft:#f3f7f9; --rule:#dce5ea; --ink-head:#082f49; --ink:#294257; --ink-muted:#63778a;
  /* desk / chrome (theme-aware) */
  --desk:#e9eff3; --desk-2:#f3f7f9; --chrome:#ffffff; --chrome-ink:#082f49; --chrome-muted:#63778a; --chrome-rule:#dce5ea;
  --field:#f3f7f9; --focus:#176eb0; --shadow:0 18px 50px rgba(14,44,64,.16);
  --font:Manrope,"Plus Jakarta Sans","DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --bar:56px; --foot:52px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --desk:#0a1220; --desk-2:#0d1728; --chrome:#0d1728; --chrome-ink:#ffffff; --chrome-muted:#b9c7d3; --chrome-rule:rgba(255,255,255,.14);
  --field:#13223a; --focus:#ff6b1a; --shadow:0 24px 70px rgba(0,0,0,.5); color-scheme:dark }}
:root[data-theme="dark"]{
  --desk:#0a1220; --desk-2:#0d1728; --chrome:#0d1728; --chrome-ink:#ffffff; --chrome-muted:#b9c7d3; --chrome-rule:rgba(255,255,255,.14);
  --field:#13223a; --focus:#ff6b1a; --shadow:0 24px 70px rgba(0,0,0,.5); color-scheme:dark }

[hidden]{display:none!important}
img{max-width:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:radial-gradient(120% 90% at 50% 40%,var(--desk-2),var(--desk));color:var(--chrome-ink);font-family:var(--font);overflow:hidden;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--chrome)}
button,input{font-family:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.app{height:100%;display:grid;grid-template-rows:var(--bar) auto minmax(0,1fr) var(--foot)}

/* toolbar */
.bar{display:flex;align-items:center;gap:12px;background:var(--chrome);border-bottom:1px solid var(--chrome-rule);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));position:relative;z-index:20}
.brand{margin:0;font:inherit;display:flex;align-items:center;gap:14px;min-width:0;flex:0 1 auto}
.brand .logo{height:34px;width:auto;display:block;flex:none}
.brand .sep{width:1px;height:28px;background:var(--chrome-rule);flex:none}
.brand .cat{display:flex;flex-direction:column;line-height:1.15;white-space:nowrap}
.brand .cat small{font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--chrome-muted)}
.brand .cat b{font-size:15px;font-weight:800;letter-spacing:-.005em;color:var(--chrome-ink)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .brand .logo{background:#fff;padding:4px 8px;border-radius:6px;height:36px}}
:root[data-theme="dark"] .brand .logo{background:#fff;padding:4px 8px;border-radius:6px;height:36px}
.spacer{flex:1}
.tbtn{text-decoration:none;height:36px;min-width:36px;padding:0 12px;border-radius:10px;border:1px solid var(--chrome-rule);background:transparent;color:var(--chrome-ink);
  font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:background .2s ease-out,border-color .2s ease-out}
.tbtn:hover{background:var(--field)}
.tbtn svg{width:18px;height:18px;flex:none}
.search{position:relative;flex:0 1 280px;min-width:0}
.search input{width:100%;box-sizing:border-box;height:36px;border-radius:10px;border:1px solid var(--chrome-rule);background:var(--field);color:var(--chrome-ink);
  padding:0 12px 0 36px;font-size:14px}
.search input::placeholder{color:var(--chrome-muted)}
.search svg{position:absolute;left:11px;top:9px;width:18px;height:18px;color:var(--chrome-muted);pointer-events:none}
.results{position:absolute;top:44px;right:0;width:min(360px,calc(100vw - 32px));max-height:min(420px,70vh);overflow:auto;background:var(--chrome);
  border:1px solid var(--chrome-rule);border-radius:12px;box-shadow:var(--shadow);padding:6px}
.res{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;border:0;background:transparent;color:var(--chrome-ink);
  padding:6px;border-radius:8px;cursor:pointer}
.res:hover,.res[aria-selected="true"]{background:var(--field)}
.res img,.res .ph{width:52px;height:39px;object-fit:cover;border-radius:4px;background:var(--soft);display:block}
.res b{font-size:13px;font-weight:800;display:block}
.res small{font-size:12px;color:var(--chrome-muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res em{font-style:normal;font-size:11px;color:var(--chrome-muted);font-variant-numeric:tabular-nums}
.empty{padding:14px;font-size:13px;color:var(--chrome-muted)}
@media (max-width:760px){ .brand .sep,.brand .cat,.tbtn .lbl{display:none} .brand .logo{height:30px} .search{flex:1 1 auto} }
@media (max-width:420px){ .bar a.tbtn:not(.pdf){display:none} .brand .logo{height:28px} }

/* stage */
.stage{position:relative;display:grid;place-items:center;min-height:0;overflow:hidden;
  padding:14px max(16px,env(safe-area-inset-right,0px)) 14px max(16px,env(safe-area-inset-left,0px))}
#frame{margin:0 auto;max-width:100%}
#book{filter:drop-shadow(0 20px 40px rgba(8,47,73,.18))}
.nav-arrow{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;border:1px solid var(--chrome-rule);
  background:var(--chrome);color:var(--chrome-ink);display:grid;place-items:center;cursor:pointer;z-index:5;box-shadow:0 6px 20px rgba(14,44,64,.08);transition:opacity .2s ease-out}
.nav-arrow svg{width:20px;height:20px}
.nav-arrow[disabled]{opacity:.3;cursor:default}
#prev{left:max(12px,env(safe-area-inset-left,0px))} #next{right:max(12px,env(safe-area-inset-right,0px))}
@media (max-width:760px){.nav-arrow{display:none}}

/* footer scrubber */
.foot{display:flex;align-items:center;gap:14px;background:var(--chrome);border-top:1px solid var(--chrome-rule);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:env(safe-area-inset-bottom,0px)}
.foot .count{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;min-width:92px}
.foot .where{font-size:12px;color:var(--chrome-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:0 1 220px;text-align:right}
#scrub{flex:1;min-width:0;accent-color:var(--orange);height:28px}
.mbtn{display:none}
@media (max-width:760px){ .mbtn{display:inline-flex} .foot .where{display:none} .foot .count{min-width:0} }

/* ---------- pages (paper) — print layout after the KOINTEC master catalogue ---------- */
.page{background:var(--paper);color:var(--ink);overflow:hidden;container-type:size;font-family:var(--font)}
.page img{display:block}
.pg{position:absolute;inset:0;display:flex;flex-direction:column;padding:5.6cqw 6cqw 4.4cqw}
/* running header: brand + hairline on left pages, hairline + collection on right pages */
.rh{display:flex;align-items:center;gap:2cqw;margin-bottom:3.6cqw;font-size:max(6.5px,1.5cqw);letter-spacing:.04em;color:var(--navy);white-space:nowrap}
.rh .ln{flex:1;height:.16cqw;background:var(--navy);opacity:.85}
.rh .br b{font-weight:800}.rh .br b i{font-style:normal;color:#e3262b}.rh .br span{font-weight:500}
.rh .col{font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.rh .col em{font-style:normal;font-weight:500;color:var(--ink-muted);margin-left:1.2cqw;letter-spacing:.02em;text-transform:none}
.folio{margin-top:auto;padding-top:2cqw;display:flex;justify-content:space-between;align-items:flex-end;gap:3cqw;font-size:max(6.5px,1.5cqw);color:var(--ink-muted)}
.folio b{font-weight:600;color:var(--ink-muted);font-variant-numeric:tabular-nums;font-size:max(7px,1.7cqw)}
.folio small{font-size:max(5.5px,1.15cqw);line-height:1.35;text-align:center;flex:1}
.left .folio{flex-direction:row}.right .folio{flex-direction:row-reverse}

/* swatch tile, labelled like the print: collection (left) · code (right) */
.tile{all:unset;box-sizing:border-box;display:flex;flex-direction:column;gap:1.1cqw;cursor:pointer;min-height:0;min-width:0;position:relative}
.tile .sw{position:relative;flex:1;min-height:0;background:var(--soft);overflow:hidden}
.tile .sw img{width:100%;height:100%;object-fit:cover;transition:transform .3s ease-out}
.tile:hover .sw img{transform:scale(1.04)}
.tile:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
.tile .lab{display:flex;justify-content:space-between;align-items:flex-start;gap:1.5cqw}
.tile .lab span{font-size:max(5.5px,1.2cqw);line-height:1.3;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-muted)}
.tile .lab b{font-size:max(9px,2.3cqw);font-weight:600;color:var(--navy);white-space:nowrap;line-height:1}
.tile .lab b::before{content:"";display:inline-block;width:.9cqw;height:.9cqw;border-radius:50%;background:var(--orange);margin-right:1cqw;vertical-align:.25cqw}
.ph{width:100%;height:100%;display:grid;place-items:center;text-align:center;color:var(--ink-muted);font-size:max(6.5px,1.4cqw);font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  background:repeating-linear-gradient(135deg,var(--soft) 0 1.2cqw,#eaf0f4 1.2cqw 2.4cqw)}
.g2{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(3,1fr);gap:3.4cqw 4cqw;flex:1;min-height:0}
.g2f{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:3.4cqw 4cqw;flex:1;min-height:0}
.g3{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(4,1fr);gap:3cqw 2.6cqw;flex:1;min-height:0}
.g3 .tile .lab b{font-size:max(8px,2cqw)}

/* photo with code callout */
.photo{position:relative;overflow:hidden;background:var(--soft)}
.photo>button:not(.callout)>img{width:100%;height:100%;object-fit:cover}
.photo>button:not(.callout){all:unset;display:block;width:100%;height:100%;cursor:pointer}
.callout{all:unset;cursor:pointer;position:absolute;display:flex;align-items:center;gap:1cqw;color:#fff;font-size:max(8px,2cqw);font-weight:800;letter-spacing:.02em;
  background:rgba(8,47,73,.55);padding:.6cqw 1.4cqw .6cqw .6cqw;border-radius:.6cqw;backdrop-filter:blur(2px)}
.callout:hover{background:rgba(8,47,73,.8)}
.callout::before{content:"N";display:grid;place-items:center;width:2.6cqw;height:2.6cqw;background:#e3262b;color:#fff;font-size:1.5cqw;font-weight:800;text-shadow:none;border-radius:.3cqw}
.callout::after{content:"";position:absolute;left:1.9cqw;top:100%;width:.16cqw;height:5cqw;background:#fff;transform-origin:top;transform:rotate(30deg);box-shadow:0 0 .6cqw rgba(0,0,0,.35)}
.callout:focus-visible{outline:2px solid #fff;outline-offset:3px}
.feat .photo{height:52cqw;flex:none;margin-bottom:3.4cqw}

/* collection opener (left page): title block on paper, photo bleeding to the edges */
.open .pg{padding-bottom:0}
.ttl{font-size:8.2cqw;line-height:1;letter-spacing:-.01em;color:var(--navy);margin:0 0 2.6cqw;text-transform:uppercase;font-weight:300;text-wrap:balance}
.ttl b{font-weight:800}
.intro{font-size:max(8px,1.95cqw);line-height:1.6;color:var(--ink);margin:0 0 3.4cqw;max-width:84cqw;padding-top:2.2cqw;border-top:.16cqw solid var(--navy)}
.roll{display:inline-flex;gap:1.4cqw;align-items:baseline;font-size:max(6.5px,1.5cqw);font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--teal);margin:0 0 1.6cqw}
.roll span{font-weight:500;color:var(--ink-muted);letter-spacing:.04em;text-transform:none}
.open .photo{flex:1;margin:0 -6cqw}
.open .folio{position:absolute;left:6cqw;right:6cqw;bottom:3.6cqw;color:#fff}
.open .folio b{color:#fff}.open .folio small{text-shadow:0 0 .6cqw rgba(0,0,0,.6)}

/* full-bleed inspiration page */
.insp .photo{position:absolute;inset:0}
.insp .folio{position:absolute;left:6cqw;right:6cqw;bottom:3.6cqw;color:#fff}
.insp .folio b{color:#fff}.insp .folio small{text-shadow:0 0 .6cqw rgba(0,0,0,.6)}

/* compact page: one or two small collections */
.compact .photo{flex:none;margin-bottom:3cqw}
.cblock{display:flex;flex-direction:column;min-height:0}
.cblock+.cblock{margin-top:3.4cqw}
.cblock .ttl{font-size:5.4cqw;margin-bottom:1.2cqw}
.cblock .intro{margin-bottom:2.6cqw;padding-top:1.6cqw}
.cgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:2.8cqw 2.6cqw}
.cgrid .tile .sw{flex:none;aspect-ratio:3/2}

/* intro / contents / applications / technical pages */
.eyebrow-ink{font-size:max(6.5px,1.6cqw);font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:var(--teal)}
.h-page{font-size:7.4cqw;line-height:1.02;font-weight:300;letter-spacing:-.01em;color:var(--navy);margin:2cqw 0 3.4cqw;text-wrap:balance;text-transform:uppercase}
.h-page b{font-weight:800}
.lede{font-size:max(8.5px,2.35cqw);line-height:1.6;color:var(--ink);margin:0 0 3cqw;max-width:80cqw}
.facts{display:grid;grid-template-columns:repeat(4,1fr);border-top:.16cqw solid var(--navy);border-bottom:.16cqw solid var(--rule);margin:1cqw 0 4cqw}
.facts div{padding:2.6cqw 0;display:flex;flex-direction:column;gap:.8cqw}
.facts div+div{padding-left:2.6cqw;border-left:.16cqw solid var(--rule)}
.facts b{font-size:6.2cqw;font-weight:800;color:var(--navy);line-height:1;font-variant-numeric:tabular-nums}
.facts span{font-size:max(6.5px,1.45cqw);font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-muted)}
.how{display:grid;grid-template-columns:1fr 1fr;gap:3cqw 4cqw}
.how h4{font-size:max(8px,2.1cqw);font-weight:800;color:var(--navy);margin:0 0 .8cqw}
.how p{font-size:max(7.5px,1.9cqw);line-height:1.55;margin:0;color:var(--ink)}
.toc{display:flex;flex-direction:column;flex:1;min-height:0}
.toc-row{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:3cqw 1fr auto;gap:2.6cqw;align-items:center;padding:1.15cqw 0;border-bottom:.16cqw solid var(--rule)}
.toc-row:first-child{border-top:.16cqw solid var(--navy)}
.toc-row i{width:1.4cqw;height:4.4cqw;display:block}
.toc-row:hover .t{color:var(--blue)}
.toc-row:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.toc-row .t{font-size:max(9px,2.7cqw);font-weight:800;color:var(--navy);letter-spacing:.02em;text-transform:uppercase;transition:color .2s ease-out}
.toc-row .s{font-size:max(6.5px,1.55cqw);color:var(--ink-muted);margin-top:.4cqw;line-height:1.4;display:block}
.toc-row .p{font-size:max(9px,2.6cqw);font-weight:700;color:var(--navy);font-variant-numeric:tabular-nums}
.apps{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1.25fr 1fr 1fr;gap:2.4cqw;flex:1;min-height:0}
.apps .a{position:relative;overflow:hidden;background:var(--soft);min-height:0}
.apps .a:first-child{grid-column:1/-1}
.apps .ab{all:unset;cursor:pointer;display:block;width:100%;height:100%}
.apps .ab img{width:100%;height:100%;object-fit:cover;transition:transform .3s ease-out}
.apps .ab:hover img{transform:scale(1.03)}
.apps .ab:focus-visible{outline:2px solid var(--blue);outline-offset:-3px}
.apps .lab{position:absolute;left:1.6cqw;bottom:1.6cqw;right:1.6cqw;display:flex;flex-direction:column;align-items:flex-start;gap:.3cqw;pointer-events:none}
.apps .lab b{background:var(--navy);color:#fff;font-size:max(7.5px,1.9cqw);font-weight:800;letter-spacing:.02em;padding:.8cqw 1.4cqw}
.apps .lab em{font-style:normal;background:rgba(255,255,255,.94);color:var(--navy);font-size:max(6.5px,1.45cqw);font-weight:700;letter-spacing:.06em;padding:.6cqw 1.4cqw}
.apps .go{position:absolute;top:1.6cqw;right:1.6cqw;display:inline-flex;align-items:center;gap:.6cqw;background:rgba(255,255,255,.94);color:var(--navy);text-decoration:none;
  font-size:max(6.5px,1.45cqw);font-weight:800;letter-spacing:.12em;text-transform:uppercase;padding:.8cqw 1.3cqw;border-radius:.6cqw;transition:background .2s ease-out}
.apps .go:hover{background:var(--orange-700);color:#fff}

      return `<div class="pg compact">${rh(no, pg.blocks.map(b => COLS[b.col].name).join(' · '))}${ph}
        ${pg.blocks.map(b => { const c = COLS[b.col]; return `<div class="cblock"><h2 class="ttl">${ttl(b.col)}</h2>${c.roll ? `<p class="roll">Roll size <span>${esc(c.roll)}</span></p>` : ''}
          ${two ? '' : `<p class="intro">${esc(c.intro)}</p>`}<div class="cgrid">${b.codes.map(tile).join('')}</div></div>`; }).join('')}
        ${folio(no, pg.photo ? DISCLAIMER : '')}</div>`;
    }
    case 'cert':
      return `<div class="pg">${rh(no, 'Certification')}<h2 class="h-page">Certification &amp; <b>test report</b></h2>
        <p class="lede" style="font-size:max(7.5px,1.85cqw)">KOINTEC interior film has been tested and approved in Korea and abroad for fire safety and eco-friendly properties.</p>
        <div class="tech">${BOOK.certs.map(([h, d, n]) => `<div><h4>${esc(h)}</h4><p>${esc(d)}${n ? `<small>${esc(n)}</small>` : ''}</p></div>`).join('')}</div>
        <div class="layers"><i style="background:#c9d6df"></i><span><b>Film layer</b></span><i style="background:#e7b56a"></i><span><b>Bubble-free adhesive layer</b> with air-release structure for quick, easy application</span><i style="background:#f1ece2"></i><span><b>Release paper</b>. An eco-friendly, alkali-degradable release paper is available on request.</span></div>
        ${folio(no, 'For certificates, please contact the seller or KOINTEC headquarters.')}</div>`;
    case 'inst1': case 'inst2':
      return `<div class="pg">${rh(no, 'Installation guide')}${pg.k === 'inst1' ? '<h2 class="h-page">Installation <b>guide</b></h2>' : ''}
        <div class="steps">${BOOK.install[pg.k].map(([h, items, ordered]) => `<section><h4>${esc(h)}</h4><div>${ordered === 'p'
          ? items.map(([t, d]) => `<p><b>${esc(t)}</b> ${esc(d)}</p>`).join('')
          : `<${ordered ? 'ol' : 'ul'}>${items.map(it => `<li>${esc(it[0])}${it[1] ? `<small>${esc(it[1])}</small>` : ''}</li>`).join('')}</${ordered ? 'ol' : 'ul'}>`}</div></section>`).join('')}</div>
        ${folio(no, 'Source: KOINTEC installation guide · www.kointec.co.kr')}</div>`;
    case 'idx': {
      const all = [...P].sort((a, b) => nat(a.code, b.code));
      const groups = {}; all.forEach(p => { const k = p.code.match(/^[A-Z]+/)[0]; (groups[k] = groups[k] || []).push(p); });
      const keys = Object.keys(groups).sort(); let acc = 0; const k0 = [], k1 = [];
      keys.forEach(k => { (acc < all.length / 2 ? k0 : k1).push(k); acc += groups[k].length; });
      return `<div class="pg">${rh(no, 'Code index')}<div class="idx">${(pg.part ? k1 : k0).map(k => `<div class="g"><h5>${k}</h5>${groups[k].map(p => `<button class="ie${p.img ? '' : ' na'}" type="button" data-code="${p.code}"><b>${p.code}</b><span>${p.page}</span></button>`).join('')}</div>`).join('')}</div>
        ${folio(no, 'Grey codes: image coming soon')}</div>`;
    }
    case 'notes': return `<div class="pg">${rh(no, 'Notes')}<div style="flex:1;background:repeating-linear-gradient(to bottom,transparent 0 5.4cqw,var(--rule) 5.4cqw calc(5.4cqw + .16cqw))"></div>${folio(no)}</div>`;
    case 'back':
      return `<div class="pg"><img class="logo-k" src="img/logo-kointec.png" alt="KOINTEC, Made in Korea">
        <div class="swatches">${FAMS.map(f => `<img loading="lazy" src="${sw(f.items.find(p => p.img).code)}" alt="">`).join('')}</div>
        <a class="url" href="https://interiorfilm.com" target="_blank" rel="noopener">interiorfilm.com</a>
        <div class="mk">UAE &nbsp;|&nbsp; KSA &nbsp;|&nbsp; QATAR</div>
        <p class="dist">Distributed by XESS Trading, authorized distributor of KOINTEC architectural interior films in the UAE since 2016.</p>
        <a class="pdfl" href="https://xesstrading.com/KOINTEC-XT-catalogue-27-28.pdf" target="_blank" rel="noopener">Download the catalogue (PDF)</a>
        <img class="logo-x" src="img/logo-xess.png" alt="XESS Trading, Premium advertising materials"></div>`;
  }
  return '';
}

/* ---- mount ---- */
const book = document.getElementById('book');
book.innerHTML = '';
pages.forEach(pg => {
  const el = document.createElement('div');
  el.className = `page ${pg.k} ${side(pg.no)}`;
  el.dataset.density = (pg.k === 'cover' || pg.k === 'back') ? 'hard' : 'soft';
  el.innerHTML = render(pg);
  book.appendChild(el);
});

/* ---- tabs ---- */
const tabL = document.createElement('div'); tabL.className = 'tabs l';
const tabR = document.createElement('div'); tabR.className = 'tabs r';
const strip = document.getElementById('tabstrip');
const frame = document.getElementById('frame');
frame.style.position = 'relative'; frame.append(tabL, tabR);
const mkTab = (t, i) => { const b = document.createElement('button'); b.type = 'button'; b.className = 'tab'; b.textContent = t.label; b.dataset.go = t.start; b.dataset.i = i;
  b.style.setProperty('--c', i % 2 ? '#e3262b' : '#176eb0'); b.title = `${t.label} · page ${t.start}`; return b; };
const tabsSide = TABS.map(mkTab), tabsStrip = TABS.map(mkTab);
tabsStrip.forEach(b => strip.appendChild(b));
[tabL, tabR, strip].forEach(el => el.addEventListener('click', e => { const b = e.target.closest('.tab'); if (b) go(+b.dataset.go); }));
function sectionOf(pageNo) { let s = -1; TABS.forEach((t, i) => { if (pageNo >= t.start) s = i; }); return s; }
function placeTabs(nums) {
  const cur = sectionOf(nums[nums.length - 1]), leftEdge = nums[0];
  tabsSide.forEach((b, i) => {
    const end = i + 1 < TABS.length ? TABS[i + 1].start - 1 : TOTAL;
    (end < leftEdge && i !== cur ? tabL : tabR).appendChild(b);
    b.setAttribute('aria-current', i === cur ? 'true' : 'false');
    tabsStrip[i].setAttribute('aria-current', i === cur ? 'true' : 'false');
  });
  // keep all tabs inside the book's height
  const h = book.getBoundingClientRect().height || 600;
  const chars = Math.max(...[tabL, tabR].map(el => [...el.children].reduce((s, b) => s + b.textContent.length, 0) || 1));
  const n = Math.max(tabL.children.length, tabR.children.length, 1);
  const fs = Math.max(8, Math.min(12, h / (chars * 0.78 + n * 2.3)));
  tabL.style.fontSize = tabR.style.fontSize = fs + 'px';
  const ac = tabsStrip[cur]; if (ac && strip.offsetParent) ac.scrollIntoView({inline:'nearest', block:'nearest'});
}

const RATIO = 595 / 842;
function sizeBook() {
  const st = document.getElementById('stage');
  const cs = getComputedStyle(st);
  const wide = innerWidth > 760;
  const aw = st.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight) - (wide ? 200 : 0);
  const ah = st.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
  const pw = ah * RATIO;
  const spread = wide && aw >= 600;
  frame.style.width = Math.floor(spread ? Math.min(aw, 2 * pw) : Math.min(aw, pw)) + 'px';
}
sizeBook();

let pf = null;
const scrub = document.getElementById('scrub'); scrub.max = TOTAL;
function init() {
  if (!window.St || !St.PageFlip) { book.innerHTML = '<div class="loading">The page-turning library did not load. Reload the page to try again.</div>'; return; }
  pf = new St.PageFlip(book, {
    width: 595, height: 842, size: 'stretch', minWidth: 240, maxWidth: 1400, minHeight: 340, maxHeight: 1980,
    showCover: true, usePortrait: true, mobileScrollSupport: false, maxShadowOpacity: 0.35, flippingTime: 650,
    drawShadow: true, showPageCorners: true, disableFlipByClick: true, clickEventForward: true, startZIndex: 0, autoSize: true,
  });
  pf.loadFromHTML(book.querySelectorAll('.page'));
  pf.on('flip', e => onPage(e.data));
  pf.on('changeOrientation', () => onPage(pf.getCurrentPageIndex()));
  const start = fromHash();
  if (start > 1) pf.turnToPage(start - 1);
  onPage(pf.getCurrentPageIndex());
}
function visible(i) {
  if (!pf) return [i];
  if (pf.getOrientation && pf.getOrientation() === 'portrait') return [i];
  if (i === 0) return [0];
  const l = i % 2 ? i : i - 1; return [l, l + 1].filter(x => x < TOTAL);
}
function onPage(i) {
  const v = visible(i), nums = v.map(x => x + 1);
  document.getElementById('count').textContent = nums.length > 1 ? `${nums[0]}–${nums[1]} / ${TOTAL}` : (nums[0] === 1 ? `Cover / ${TOTAL}` : `${nums[0]} / ${TOTAL}`);
  document.getElementById('where').textContent = [...new Set(v.map(x => pages[x].label))].join(' · ');
  scrub.value = nums[0];
  document.getElementById('prev').disabled = i <= 0;
  document.getElementById('next').disabled = v[v.length - 1] >= TOTAL - 1;
  placeTabs(nums);
  try { history.replaceState(null, '', nums[0] > 1 ? '#page-' + nums[0] : location.pathname + location.search); } catch (e) {}
  const els = book.querySelectorAll('.page');
  for (let k = Math.max(0, v[0] - 2); k <= Math.min(TOTAL - 1, v[v.length - 1] + 3); k++)
    els[k] && els[k].querySelectorAll('img[loading="lazy"]').forEach(im => { im.loading = 'eager'; });
}
function fromHash() { const m = location.hash.match(/^#page-(\d+)$/); return m ? Math.min(TOTAL, Math.max(1, +m[1])) : 1; }
function go(no) {
  if (!pf) return; const idx = Math.min(TOTAL - 1, Math.max(0, no - 1)), c = pf.getCurrentPageIndex();
  if (visible(c).includes(idx)) return;
  if (Math.abs(idx - c) <= 2) pf.flip(idx); else { pf.turnToPage(idx); onPage(idx); }
}
addEventListener('hashchange', () => { const n = fromHash(); if (pf && n - 1 !== pf.getCurrentPageIndex()) go(n); });

document.getElementById('prev').onclick = document.getElementById('mprev').onclick = () => pf && pf.flipPrev();
document.getElementById('next').onclick = document.getElementById('mnext').onclick = () => pf && pf.flipNext();
document.getElementById('tocBtn').onclick = () => go(BOOK.tocPage);
document.getElementById('idxBtn').onclick = () => go(idxStart);
scrub.addEventListener('input', () => { const n = +scrub.value; document.getElementById('count').textContent = `${n} / ${TOTAL}`; document.getElementById('where').textContent = pages[n - 1].label; });
scrub.addEventListener('change', () => go(+scrub.value));
addEventListener('keydown', e => {
  if (e.target.closest && e.target.closest('input')) return;
  if (!document.getElementById('lb').hidden) { if (e.key === 'Escape') closeLB(); if (e.key === 'ArrowRight') stepLB(1); if (e.key === 'ArrowLeft') stepLB(-1); return; }
  if (e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); pf && pf.flipNext(); }
  if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); pf && pf.flipPrev(); }
  if (e.key === 'Home') go(1); if (e.key === 'End') go(TOTAL);
});
book.addEventListener('click', e => {
  const t = e.target.closest('[data-code],[data-go]'); if (!t) return;
  if (t.dataset.go) go(+t.dataset.go); else openLB(t.dataset.code);
});
let rT; addEventListener('resize', () => { clearTimeout(rT); rT = setTimeout(() => { sizeBook(); pf && pf.update && pf.update(); onPage(pf ? pf.getCurrentPageIndex() : 0); }, 120); });

/* ---- lightbox ---- */
const ORDER = FAMS.flatMap(f => f.items);
const lb = document.getElementById('lb'); let cur = null, lastFocus = null;
function openLB(code) {
  const p = byCode[code]; if (!p) return; cur = p; lastFocus = lastFocus || document.activeElement;
  const g = GN[p.group], i = ORDER.indexOf(p);
  const kindLabel = p.akind === 'Application' ? 'In an interior' : (p.akind || '');
  lb.innerHTML = `<button class="x" type="button" aria-label="Close" id="lbX"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  <div class="card">
    <div class="media">${p.img ? `<figure><img src="${sw(p.code)}" alt="${esc(p.code)} swatch"><figcaption>Swatch</figcaption></figure>
      ${p.akind ? `<figure><img src="${ap(p.code)}" alt="${esc(titleName(p))}, ${esc(kindLabel.toLowerCase())}"><figcaption>${esc(kindLabel)}</figcaption></figure>` : ''}`
      : `<figure><div class="ph">Image coming soon</div></figure>`}</div>
    <div class="info"><div class="eb">${esc(g.fam.name === g.name ? g.name : g.fam.name + " · " + g.name)}</div>
      <h3 id="lbCode">${esc(p.code)}</h3><h4>${esc(titleName(p))}</h4>
      ${p.blurb ? `<p>${esc(p.blurb)}</p>` : `<p>Ask our team for a physical sample of this finish.</p>`}
      <dl><dt>Code</dt><dd>${esc(p.code)}</dd><dt>Collection</dt><dd>${esc(g.name)}</dd><dt>Material</dt><dd>${p.brand === '' ? 'Not a KOINTEC brand' : 'KOINTEC architectural interior film'}</dd>${(p.size || COLS[p.group].roll) ? `<dt>Roll size</dt><dd>${esc(p.size || COLS[p.group].roll)}</dd>` : ""}<dt>Page</dt><dd>${p.page}</dd></dl>
      <div class="acts"><button class="btn pri" type="button" id="lbCopy"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 00-1-1H5a1 1 0 00-1 1v10a1 1 0 001 1h3"/></svg>Copy code</button>
        <button class="btn" type="button" id="lbPage">Go to page ${p.page}</button>
        <a class="btn" href="${p.url || FAMLINK[g.fam.id]}" target="_blank" rel="noopener">${p.url ? "View Product" : "View Products"}</a>
        <a class="btn wa" href="${waLink(p)}" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17.5 14.4c-.3-.1-1.8-.9-2-1-.3-.1-.5-.1-.7.1-.2.3-.8 1-.9 1.2-.2.2-.3.2-.6.1-.3-.1-1.3-.5-2.4-1.5-.9-.8-1.5-1.8-1.7-2.1-.2-.3 0-.5.1-.6l.4-.5c.2-.2.2-.3.3-.5.1-.2 0-.4 0-.5l-.9-2.2c-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.4-.3.3-1 1-1 2.5s1.1 2.9 1.2 3.1c.1.2 2.1 3.2 5.1 4.5 2.5 1 3 .8 3.6.8.5-.1 1.8-.7 2-1.4.2-.7.2-1.3.2-1.4-.1-.2-.3-.3-.6-.4zM12 2a10 10 0 00-8.6 15.1L2 22l5-1.3A10 10 0 1012 2zm0 18.2c-1.5 0-3-.4-4.3-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1112 20.2z"/></svg>Order on WhatsApp</a></div>
      <div class="pager"><button class="btn" type="button" id="lbPrev" ${i <= 0 ? 'disabled' : ''} aria-label="Previous finish">‹ Prev</button><span style="align-self:center">${i + 1} of ${ORDER.length}</span><button class="btn" type="button" id="lbNext" ${i >= ORDER.length - 1 ? 'disabled' : ''} aria-label="Next finish">Next ›</button></div>
    </div></div>`;
  lb.hidden = false;
  document.getElementById('lbX').onclick = closeLB;
  document.getElementById('lbPrev').onclick = () => stepLB(-1);
  document.getElementById('lbNext').onclick = () => stepLB(1);
  document.getElementById('lbPage').onclick = () => { const n = p.page; closeLB(); go(n); };
  document.getElementById('lbCopy').onclick = () => copy(p.code);
  document.getElementById('lbX').focus();
}
function stepLB(d) { if (!cur) return; const i = ORDER.indexOf(cur) + d; if (i >= 0 && i < ORDER.length) openLB(ORDER[i].code); }
function closeLB() { lb.hidden = true; lb.innerHTML = ''; const f = lastFocus; lastFocus = null; cur = null; f && f.focus && f.focus(); }
lb.addEventListener('click', e => { if (e.target === lb) closeLB(); });
function toast(t) { const el = document.getElementById('toast'); el.textContent = t; el.hidden = false; clearTimeout(el._t); el._t = setTimeout(() => el.hidden = true, 1800); }
function copy(code) {
  const ok = () => toast(`Copied ${code}`);
  try { navigator.clipboard.writeText(code).then(ok, () => toast(`Code: ${code}`)); } catch (e) { toast(`Code: ${code}`); }
}

/* ---- search ---- */
const q = document.getElementById('q'), res = document.getElementById('results'); let hits = [], sel = 0;
const norm = s => s.toLowerCase().replace(/[\s\-]/g, '');
function search() {
  const v = q.value.trim(); if (!v) { res.hidden = true; return; }
  const n = norm(v), words = v.toLowerCase().split(/\s+/);
  hits = P.filter(p => norm(p.code).includes(n) || words.every(w => (titleName(p) + ' ' + GN[p.group].name + ' ' + p.blurb).toLowerCase().includes(w)))
          .sort((a, b) => (norm(b.code).startsWith(n) - norm(a.code).startsWith(n)) || nat(a.code, b.code)).slice(0, 30);
  sel = 0;
  res.innerHTML = hits.length ? hits.map((p, i) => `<button class="res" type="button" role="option" aria-selected="${i === sel}" data-code="${p.code}">
      ${p.img ? `<img src="${sw(p.code)}" alt="">` : '<span class="ph"></span>'}<span style="min-width:0"><b>${p.code}</b><small>${esc(titleName(p))}</small></span><em>p. ${p.page}</em></button>`).join('')
    : `<div class="empty">No finish matches “${esc(v)}”. Try a code like SD 901 or a word like oak.</div>`;
  res.hidden = false;
}
function pick(code) { const p = byCode[code]; res.hidden = true; q.blur(); go(p.page); setTimeout(() => openLB(code), 700); }
q.addEventListener('input', search);
q.addEventListener('focus', () => q.value && search());
q.addEventListener('keydown', e => {
  if (e.key === 'Escape') { res.hidden = true; q.blur(); }
  if (!hits.length || res.hidden) return;
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); sel = (sel + (e.key === 'ArrowDown' ? 1 : -1) + hits.length) % hits.length;
    res.querySelectorAll('.res').forEach((b, i) => b.setAttribute('aria-selected', i === sel)); res.querySelectorAll('.res')[sel].scrollIntoView({block:'nearest'}); }
  if (e.key === 'Enter') { e.preventDefault(); pick(hits[sel].code); }
});
res.addEventListener('click', e => { const b = e.target.closest('.res'); if (b) pick(b.dataset.code); });
document.addEventListener('click', e => { if (!e.target.closest('.search')) res.hidden = true; });

init();
</script>
